spring.application.name=rest-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/energy
spring.datasource.username=disysuser
spring.datasource.password=disyspw

spring.jpa.show-sql=false

# Die REST-API darf nur lesen, deshalb keine Schema-Aenderungen.
# Die Tabellen werden vom Usage- und Percentage-Service angelegt.
spring.jpa.hibernate.ddl-auto=none

# Datum als Text im Format 2025-01-10T14:00:00 ausgeben.
spring.jackson.serialization.write-dates-as-timestamps=false
